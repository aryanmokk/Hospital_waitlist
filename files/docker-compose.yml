services:
  mongo:
    image: mongo:7
    container_name: team_project_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: hse_raw

  postgres:
    image: postgis/postgis:16-3.4
    container_name: team_project_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: teamproj
      POSTGRES_PASSWORD: teamproj
      POSTGRES_DB: waitlists
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/schema_postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

volumes:
  mongo_data:
  pg_data:
